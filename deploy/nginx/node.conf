# nginx de un nodo de streaming.
server {
    listen 80 default_server;
    server_name _;

    # Ficheros VOD: el agente autoriza y nginx sirve (X-Accel-Redirect).
    # "internal" impide que los clientes pidan esta ruta directamente.
    location /_vod/ {
        internal;
        alias /;
        add_header Accept-Ranges bytes;
        sendfile on;
        tcp_nopush on;
    }

    # Uso interno: el servidor de entrada pregunta al agente por las claves
    location /ingest/ {
        deny all;
    }

    # Subida de vídeos desde el panel: sin límite de tamaño ni búfer en disco
    location /upload/ {
        client_max_body_size 0;
        proxy_request_buffering off;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
        proxy_pass http://agent:8081;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location / {
        proxy_pass http://agent:8081;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Connection "";
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # El .ts en directo es una respuesta infinita: sin buffer y sin timeout corto
        proxy_buffering off;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
    }
}
