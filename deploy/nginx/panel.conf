# nginx del servidor principal. Para HTTPS pon delante certbot o Cloudflare.
server {
    listen 80 default_server;
    server_name _;

    client_max_body_size 20m;

    # La API de administración solo desde IPs de confianza (ajusta a tu IP)
    # location /admin/ {
    #     allow 1.2.3.4;
    #     deny all;
    #     proxy_pass http://panel:8080;
    # }

    location /internal/ {
        # Solo los nodos (ajusta a las IPs de tus VPS)
        # allow 10.0.0.0/8;
        # deny all;
        proxy_pass http://panel:8080;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location / {
        proxy_pass http://panel:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
}
