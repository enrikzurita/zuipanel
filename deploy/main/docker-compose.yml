# Servidor principal: panel + MariaDB + Redis + nginx
# Uso: cp main.env.example .env && editar && docker compose up -d --build

services:
  mariadb:
    image: mariadb:11
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: zuipanel
      MARIADB_USER: zuipanel
      MARIADB_PASSWORD: ${DB_PASSWORD}
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
    volumes:
      - mariadb:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    # Los nodos de carga se conectan a este Redis: protégelo con contraseña
    # y abre el puerto 6379 en UFW SOLO para las IPs de tus nodos.
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD}", "--appendonly", "no"]
    ports:
      - "6379:6379"

  panel:
    build:
      context: ../..
      target: panel
    restart: unless-stopped
    depends_on:
      mariadb:
        condition: service_healthy
      redis:
        condition: service_started
    environment:
      DATABASE_URL: mysql://zuipanel:${DB_PASSWORD}@mariadb:3306/zuipanel
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      STREAM_SECRET: ${STREAM_SECRET}
      ADMIN_TOKEN: ${ADMIN_TOKEN}
      AGENT_KEY: ${AGENT_KEY}
      PUBLIC_URL: ${PUBLIC_URL}
      TZ_NAME: ${TZ_NAME:-Europe/Madrid}

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on: [panel]
    ports:
      - "${HTTP_PORT:-80}:80"
    volumes:
      - ../nginx/panel.conf:/etc/nginx/conf.d/default.conf:ro

  # Opcional: el servidor principal también puede emitir canales
  # agent:
  #   build: { context: ../.., target: agent }
  #   restart: unless-stopped
  #   environment: { ...ver deploy/node/node.env.example... }

volumes:
  mariadb:
