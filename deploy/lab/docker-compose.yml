# Laboratorio completo en una sola máquina:
#   panel + MariaDB + Redis + nodo (agente + nginx) + canales de prueba + datos de ejemplo
# Se levanta con deploy/lab/bootstrap.sh (genera el .env y arranca todo).

x-zui-common: &zui-common
  restart: unless-stopped

services:
  mariadb:
    <<: *zui-common
    image: mariadb:11
    environment:
      MARIADB_DATABASE: zuipanel
      MARIADB_USER: zuipanel
      MARIADB_PASSWORD: ${DB_PASSWORD}
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
    volumes:
      - mariadb:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      retries: 30

  redis:
    <<: *zui-common
    image: redis:7-alpine
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD}", "--appendonly", "no", "--save", ""]

  panel:
    <<: *zui-common
    build:
      context: ../..
      target: panel
    image: zuipanel-panel:lab
    depends_on:
      mariadb: { condition: service_healthy }
      redis: { condition: service_started }
    environment:
      DATABASE_URL: mysql://zuipanel:${DB_PASSWORD}@mariadb:3306/zuipanel
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      STREAM_SECRET: ${STREAM_SECRET}
      ADMIN_TOKEN: ${ADMIN_TOKEN}
      AGENT_KEY: ${AGENT_KEY}
      PUBLIC_URL: http://${LAB_IP}:${PANEL_PORT:-8080}
      TZ_NAME: Europe/Madrid
    ports:
      - "${PANEL_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8080/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 5s
      retries: 30

  # Genera películas y episodios de prueba (una sola vez)
  media-init:
    build:
      context: ../..
      target: agent
    image: zuipanel-agent:lab
    user: root
    restart: "no"
    command: ["sh", "/lab/make-media.sh"]
    volumes:
      - ./:/lab:ro
      - media:/media

  # Emite canales de prueba en directo por HTTP (carta de ajuste + tono)
  testsrc:
    <<: *zui-common
    image: zuipanel-agent:lab
    depends_on:
      media-init: { condition: service_completed_successfully }
    command: ["node", "/lab/test-source.mjs"]
    volumes:
      - ./:/lab:ro

  agent:
    <<: *zui-common
    image: zuipanel-agent:lab
    # Para medir el tráfico de red del servidor completo, no solo del contenedor
    pid: host
    depends_on:
      panel: { condition: service_healthy }
      media-init: { condition: service_completed_successfully }
    environment:
      SERVER_ID: 1
      PANEL_URL: http://panel:8080
      AGENT_KEY: ${AGENT_KEY}
      STREAM_SECRET: ${STREAM_SECRET}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      X_ACCEL_PREFIX: /_vod
      IDLE_TIMEOUT: 60
      SYNC_INTERVAL: 15
      NET_STATS_PATH: /proc/1/net/dev
      INGEST_RTMP: rtmp://ingest:1935/live
      INGEST_STAT_URL: http://ingest:8088/stat
      RECORD_DIR: /media/grabaciones
      UPLOAD_DIR: /media/subidas
    volumes:
      - type: tmpfs
        target: /var/lib/zuipanel/hls
        tmpfs: { size: 1073741824 }
      - media:/media

  # Entrada RTMP: OBS o la app de la cámara publican en rtmp://IP:1935/live
  ingest:
    <<: *zui-common
    build:
      context: ../..
      target: ingest
    image: zuipanel-ingest:lab
    depends_on: [agent]
    environment:
      AGENT_URL: http://agent:8081
    ports:
      - "${RTMP_PORT:-1935}:1935"

  node-nginx:
    <<: *zui-common
    image: nginx:1.27-alpine
    depends_on: [agent]
    ports:
      - "${NODE_PORT:-8081}:80"
    volumes:
      - ../nginx/node.conf:/etc/nginx/conf.d/default.conf:ro
      - media:/media:ro

  # Crea los datos de ejemplo mediante la API de administración (idempotente)
  seed:
    image: zuipanel-agent:lab
    restart: "no"
    depends_on:
      panel: { condition: service_healthy }
    environment:
      PANEL_URL: http://panel:8080
      ADMIN_TOKEN: ${ADMIN_TOKEN}
      NODE_PUBLIC_URL: http://${LAB_IP}:${NODE_PORT:-8081}
      SRC_URL: http://testsrc:9000
      LAB_USER: ${LAB_USER}
      LAB_PASS: ${LAB_PASS}
    command: ["node", "/lab/seed.mjs"]
    volumes:
      - ./:/lab:ro

volumes:
  mariadb:
  media:
